name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
    - "docs/**"
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Reads the version from gradle/wrapper/gradle-wrapper.properties's
          # distributionUrl directly, so there's nothing to keep in sync here
          # even though gradlew itself isn't committed (release.yml does the same).
          gradle-version: wrapper

      - name: Build mod jar
        run: gradle build --no-daemon
